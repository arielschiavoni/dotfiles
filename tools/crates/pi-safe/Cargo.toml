[package]
name = "pi-safe"
description = "Run the pi coding agent inside a bubblewrap + pasta sandbox on the devbox VM"
# Inherited from [workspace.package] in ../../Cargo.toml
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Linux-only: the sandbox itself is bwrap + pasta, exec'd as external
# processes (Ubuntu ships AppArmor profiles for both; a self-built binary
# creating user namespaces would need its own). install/darwin/install.sh skips
# this crate.
[dependencies]
anyhow = { workspace = true }
# the real ~/.aws/config: the regions of the AWS profiles the broker serves
aws-session = { path = "../aws-session" }
clap = { workspace = true }
# glob matching for deny_projects and filesystem.hidden; already compiled
# for `ignore`.
globset = "0.4"
# fast directory walk that resolves filesystem.hidden globs
ignore = { workspace = true }
serde = { version = "1", features = ["derive"] }
# the broker's health answer and pi's auth.json (placeholder copy)
serde_json = { workspace = true }
toml = "0.9"

