[package]
name        = "cred-broker"
description = "HTTP proxy that puts real credentials into the requests of sandboxed agents, which only hold placeholders"
# Inherited from [workspace.package] in ../../Cargo.toml
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# Linux-only in practice: `start` detaches with util-linux's setsid, and its
# only client is pi-safe. install/darwin/install.sh skips this crate.
[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
jiff       = { workspace = true }
serde      = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
toml       = "0.9"

# The proxy. All TLS is rustls with the `ring` backend (no cmake or C++
# toolchain needed, unlike aws-lc-rs).
base64         = "0.22"
http-body-util = "0.1"
hyper          = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls   = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util     = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# the CA and the per-host certificates it signs
rcgen          = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio          = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
