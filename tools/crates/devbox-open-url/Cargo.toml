[package]
name        = "devbox-open-url"
description = "Open URLs from the devbox VM in the macOS default browser"
# Inherited from [workspace.package] in ../../Cargo.toml
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true

# No [dependencies]: everything here is std.
#
# The `url` crate would add the two normalisations std cannot do — Punycode for
# internationalised hosts and percent-encoding for non-ASCII paths — but pulls
# 20+ crates via idna -> idna_adapter -> ICU4X, and idna_adapter exposes only a
# `compiled_data` feature, so there is no lighter backend. The consequence is
# that non-ASCII URLs are rejected rather than encoded; see `normalize` in
# src/lib.rs for the upgrade path.

# Cargo infers all three targets from the file layout, so no [[bin]] sections:
#
#   src/lib.rs           -> library, shared by both binaries
#   src/main.rs          -> bin "devbox-open-url" (named after the package)
#   src/bin/xdg-open.rs  -> bin "xdg-open"
#
# Declaring [[bin]] explicitly *and* keeping files under src/bin/ is how you get
# a duplicate-target error.
