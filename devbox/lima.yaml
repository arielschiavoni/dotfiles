# devbox - Linux development VM on macOS
#
# WHY THIS EXISTS
# ---------------
# The host OS observes every file operation that crosses the VFS boundary —
# kernel hooks, security frameworks, antivirus scanners, and filesystem event
# APIs all add per-syscall overhead that compounds badly at scale.
# Inside a VM the host sees ONE disk image file rather than ~500k operations;
# the guest kernel handles its own VFS entirely in the hypervisor, at native
# speed. Measured on this machine:
#
#   macOS ~/repos   491,190 entries   warm walk 40.60s   82.7 us/entry
#   guest-native      37,701 entries   warm walk  0.04s    1.06 us/entry
#
# Reference: bare-metal Linux does the same benchmark in 3s / 15s versus
# 2m34s / 3m28s on this Mac.
#
# CRITICAL INVARIANT
# ------------------
# Only ~/share is mounted (virtiofs), for occasional file transfers only.
# Development work must NOT run inside ~/share — virtiofs crosses the host
# VFS boundary and reintroduces host-OS per-syscall overhead.
# Work lives anywhere inside the guest home (Lima uses /home/devbox.guest).

minimumLimaVersion: 2.0.0

# NOTE: deliberately based on the *image* template, not `template:ubuntu-26.04`.
# The composite template chains to `_default/mounts`, which sets
# `mounts: [location: "~"]`. A top-level `mounts: []` does NOT override it -
# Lima treats the empty list as "unset" and the base template wins, which
# silently virtiofs-mounts the whole host home directory, crossing the host
# VFS boundary and reintroducing host-OS per-syscall overhead.
# The image template provides the genericcloud aarch64 image only, with no
# mount or network defaults — our explicit config below is the sole source
# of truth.
base:
  - template:_images/ubuntu-26.04

# Apple Virtualization.framework. Note vz cannot run x86_64 guests on Apple
# Silicon, so an official aarch64 image is mandatory.
vmType: "vz"

user:
  name: devbox

cpus: 6
memory: "16GiB"

# Sparse: 100GiB declared costs ~0 until written. Matches Lima's own default;
# stated explicitly so the size is pinned if that default ever changes.
disk: "100GiB"

# ~/share is a writable virtiofs mount for host<->guest file transfers.
# IMPORTANT: do NOT use ~/share for development work — virtiofs crosses the
# host VFS boundary, so any filesystem-heavy operation there reintroduces
# host-OS per-syscall overhead. Use it only for occasional file transfers
# (archives, build artifacts, etc.). Development work must live inside the
# guest on the main disk.
mounts:
  - location: "~/share"
    mountPoint: "{{.Home}}/share"
    writable: true

# vzNAT gives the guest a real host-reachable IP, so dev servers are
# reachable from Chrome without per-port forwarding rules.
# vzNAT needs no socket_vmnet binary and no sudoers edit.
networks:
  - vzNAT: true

ssh:
  # Fixed port so ~/.ssh/config survives destroy + create cycles.
  # 60022 is arbitrary but stable; change it only if it conflicts locally.
  localPort: 60022
  forwardAgent: true

# GithubToken is injected at create time by create.sh via --param.
# param (NOT env) is required: user-mode provision scripts run under
# `sudo -i --preserve-env=PARAM_*`, which strips all other env vars.
# Exposed in provision scripts as $PARAM_GithubToken.
param:
  GithubToken: ""

# Lima runs ALL provision scripts on EVERY boot, not only at creation.
# Both scripts are therefore idempotent and cheap on the no-op path.
# `file` paths resolve relative to this yaml.
provision:
  - mode: system
    file: provision/00-system.sh
  - mode: user
    file: provision/20-user.sh

probes:
  - mode: readiness
    description: devbox system provisioning to finish
    script: |
      #!/bin/bash
      set -eu -o pipefail
      if ! timeout 300s bash -c "until [ -f /var/lib/devbox/.system-ready ]; do sleep 3; done"; then
        echo >&2 "devbox system provisioning did not complete"
        exit 1
      fi
    hint: |
      System provisioning did not finish.
      Inspect: limactl shell devbox sudo journalctl -u cloud-init -f
