[tools]
# Language runtimes (core backends)
node = "latest"
python = "latest"
go = "latest"
rust = "latest"
bun = "latest"

# Shell
"aqua:fish-shell/fish-shell" = "latest"

# CLI tools
atuin = "latest"
aws-cli = "latest"
aws-sam = "latest"
btop = "latest"
dua = "latest"
dust = "latest"
duckdb = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
gopass = "latest"
hcloud = "latest"
hunk = "latest"
jq = "latest"
k6 = "latest"
lazygit = "latest"
pnpm = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
stylua = "latest"
terraform = "latest"
tmux = "latest"
trivy = "latest"
uv = "latest"
witr = "latest"
yazi = "latest"
zoxide = "latest"

"aqua:anthropics/claude-code" = "latest"
"aqua:joshmedeski/sesh" = "latest"
"aqua:openai/codex" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
# pi: upgrade with `mise up npm:@earendil-works/pi-coding-agent`, never with a
# bare `pi update` - that rewrites this install in place, behind mise's back.
# `pi update --extensions` (packages only) is fine. After upgrading, bump the
# pinned pi version in config/pi/.pi/agent/package.json and run `pnpm install`
# there, so extension types match the installed pi.
"npm:@earendil-works/pi-coding-agent" = "latest"
"github:agavra/tuicr" = "latest"
# Terminal markdown previewer; not in the mise registry, so it comes from the
# GitHub release binaries.
"github:RivoLink/leaf" = "latest"
# Browser automation for agents (skills agent-browser, agent-browser-local).
# The npm package, not the GitHub binary: only it bundles the guides that
# `agent-browser skills get core` prints, matching the installed version.
# Drives the apt chromium from devbox/provision/00-system.sh;
# `agent-browser install` has no Linux arm64 browser to download.
"npm:agent-browser" = "latest"
# Page audits; finds the same /usr/bin/chromium.
"npm:lighthouse" = "latest"
"npm:@asg-song/bork-cli" = "latest"

[settings]
# Don't read the node version from package.json (engines) when resolving
# versions; only .node-version / .nvmrc are honored.
idiomatic_version_file_disable_files = ["node:package.json"]
# Only read idiomatic version files for node; other tools use mise.toml.
idiomatic_version_file_enable_tools = ["node"]
# Use pnpm for npm-backed tools (`npm:` entries above) instead of npm.
npm.package_manager = "pnpm"
