# cred-broker (tools/crates/cred-broker): an HTTP proxy that puts the real
# credentials into the requests of sandboxed agents (pi-safe), which only
# hold placeholders.
#
# No secrets here: which credential goes to which host, and where it is read
# from. Only the hosts below are decrypted; all other traffic is tunnelled
# untouched. Changes apply on `cred-broker restart`.
#
# Placeholders, each replaced only in its own field:
#   {org}       [github] token_command - the project's org (the sandbox sends
#               it as the proxy username: ~/repos/<org>/...), else `default`
#   {provider}  [oauth] token_command - the pi login: github-copilot, anthropic
#   {secret}    [[header]] value - the rule's secret_command / secret_env
#   {profile}   [aws] commands - the AWS profile asked for

# 127.0.0.1 only. pi-safe reads it from `cred-broker status --json`.
# port = 18080
# CA, logs (requests.jsonl, broker.log)
# state_dir = "~/.local/state/cred-broker"

[github]
# Host -> how the token is sent (github.com: git over HTTPS).
hosts = { "api.github.com" = "bearer", "uploads.github.com" = "bearer", "raw.githubusercontent.com" = "bearer", "github.com" = "basic" }
# The token of the sandbox's project org ({org}: ~/repos/<org>/..., else
# `default`): the lookup git and fish use, gopass
# personal/dotfiles/github-tokens/<org>, falling back to .../default.
token_command = ["git-credential-multiaccount", "token", "{org}"]

# pi's logins (github-copilot, anthropic), for *.githubcopilot.com and
# api.anthropic.com - one subscription each, whatever the project. Read from
# the real auth.json while valid; when about to expire, pi refreshes them with
# this (under its lock, saved for plain pi).
[oauth]
# auth = "~/.pi/agent/auth.json"
token_command = [
  "pi",
  "auth",
  "print-bearer-token",
  "--provider",
  "{provider}",
  "--min-expiry",
  "30m",
]

# Static headers: host + path prefix -> header; the secret from `secret_env`
# (the broker's environment) or `secret_command` (its stdout).
[[header]]
name = "jira"
host = "collaboration.msi.audi.com"
path = "/jira/"
header = "Authorization"
value = "Bearer {secret}"
secret_command = [
  "gopass",
  "show",
  "--password",
  "personal/dotfiles/msi-audi-jira/JIRA_PAT_TOKEN",
]

# AWS: credentials for the sandbox's `aws` (its credential_process asks
# http://cred-broker/aws/<profile>). AWS clients sign each request themselves,
# so the sandbox holds these credentials: serve read-only roles. It gets their
# short-lived role credentials (1h for a chained role); the SSO token stays here.
# pi-safe writes the sandbox's ~/.aws/config with the profiles of
# ~/.aws/config that match; the aws-profile pi extension picks one.
[aws]
# Globs: `*` is any characters, dots included.
profiles = ["*.agent"]
# Exit 0 + credential_process JSON, or exit 1: an SSO login is needed. Renews
# the role credentials and the SSO token silently while the SSO session lasts.
# credentials_command = ["aws-session", "credentials", "{profile}"]
# When it has ended: a device code login, opened in the Mac's browser (via
# devbox-bridge's xdg-open) and announced in tmux; the sandbox's request waits
# for the approval (5 min). After an unapproved one, the next starts 5 min later.
# login_command = ["aws-session", "login", "{profile}", "--device-code", "--notify"]

# Never allowed from the sandbox: token exchanges, which return real tokens.
[[block]]
host = "api.github.com"
path = "/copilot_internal/v2/token"

[[block]]
host = "github.com"
path = "/login/"

[[block]]
host = "platform.claude.com"
path = "/v1/oauth/"

[[block]]
host = "console.anthropic.com"
path = "/v1/oauth/"
