# yaml-language-server: $schema=https://dlvhdr.github.io/gh-dash/configuration/gh-dash/schema.json
prSections:
  - title: To Review
    filters: is:open -author:@me -author:dependabot[bot] updated:>={{ nowModify "-3w" }} sort:updated-desc
  - title: Involved
    filters: is:open involves:@me -author:@me -author:dependabot[bot] updated:>={{ nowModify "-3w" }} sort:updated-desc
  - title: My Pull Requests
    filters: is:open author:@me updated:>={{ nowModify "-3w" }} sort:updated-desc
    layout:
      author:
        hidden: true
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: false
    width: 150
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal: []
  issues: []
  prs:
    # Both keys delegate to the `gh_pr_review` fish function, which creates a
    # tmux session + git worktree named after the PR. See
    # config/fish/.config/fish/functions/gh_pr_review.fish
    - key: d
      name: Diff
      command: gh_pr_review --mode diff --repo "{{.RepoName}}" --pr "{{.PrNumber}}" --branch "{{.HeadRefName}}" --base "{{.BaseRefName}}" --path "{{.RepoPath}}"
    - key: c
      name: Code review
      command: gh_pr_review --mode review --repo "{{.RepoName}}" --pr "{{.PrNumber}}" --branch "{{.HeadRefName}}" --base "{{.BaseRefName}}" --path "{{.RepoPath}}"
  branches: []
repoPaths:
  oneaudi/*: ~/repos/oneaudi/*
  arielschiavoni/*: ~/repos/arielschiavoni/*
  volkswagen-onehub/*: ~/repos/volkswagen-onehub/*
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
