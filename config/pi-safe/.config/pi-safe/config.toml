# pi-safe - sandbox for the pi coding agent (tools/crates/pi-safe)
#
# Every key is optional; commented values are the built-in defaults. A list
# set here REPLACES the default list, so copy the default entries you want to
# keep.
#
# Inspect the result for the current directory with `pi-safe --dry-run`, and
# test it with `pi-safe --check`.

# Program run inside the sandbox; pi-safe's trailing arguments are appended.
# command = ["pi"]

# Sandbox-only state: its $HOME (npm/pnpm caches, shell history), pi's
# sandbox-local files (logs, model cache, trust decisions) and resolv.conf.
# state_dir = "~/.local/state/pi-safe"

# Directories that may never be the project (the one writable tree). `*` does
# not cross `/`. Ancestors of $HOME are always refused.
# deny_projects = ["/", "/home", "~", "~/repos", "~/repos/*", "~/share", "/tmp", "/var/tmp", "/dev/shm"]

[network]
# "pasta": own network namespace - internet yes, the VM's localhost no
# "host":  the VM's network, including EVERY localhost service (unsafe)
# "none":  no network at all (pi itself cannot reach its model provider)
# mode = "pasta"

# VM localhost ports the sandbox may connect to, e.g. a database or dev server
# you started outside. CLI: --port N
host_ports = []

# Sandbox ports published on the VM, e.g. a dev server the agent starts that
# the Mac browser should reach. CLI: --publish N
publish_ports = []

[filesystem]
# Visible read-only, besides /usr, /etc and friends. Symlinks are resolved.
# Set here, so not shown commented: the first two lines are the defaults
# (mise, git config, skills, and ~/repos for context from other projects,
# its secrets covered by `hidden` below). Plus two ~/share dirs, and never the rest of ~/share, which can hold
# sensitive files such as exported keys: screenshots in place of clipboard
# image paste (the Mac clipboard bridge stays out of the sandbox), and agent
# for any other file to hand over. Mention them with tmux `prefix o f`. A
# dir that does not exist is skipped.
read_only = [
  "~/.local/share/mise",
  "~/.config/mise",
  "~/.config/git",
  "~/.agents",
  "~/.config/opencode/skills",
  "~/repos",
  "~/share/screenshots",
  "~/share/agent",
]

# Visible read-write, in addition to the project.
# read_write = []

# Hidden inside visible trees: files show up empty, dirs empty. Paths or
# globs - `*` stays within one dir, `**` crosses dirs. Globs are resolved on
# every start, one walk per base dir (.git, node_modules and build/cache dirs
# such as target, dist, .venv are skipped: SKIP_DIRS in src/hide.rs). A glob
# match git tracks stays visible - its content is in .git anyway, and
# committed .env.aws.dev or .env.example files are config the agent needs -
# so what gets hidden is what is untracked, usually gitignored: env files,
# Cloudflare .dev.vars, Terraform vars and state, keys.
# hidden = [
#   "~/repos/**/.env", "~/repos/**/.env.*", "~/repos/**/*.env",
#   "~/repos/**/.dev.vars", "~/repos/**/*.tfvars", "~/repos/**/*.tfstate",
#   "~/repos/**/*.tfstate.*", "~/repos/**/*.pem", "~/repos/**/*.key",
#   "~/repos/**/*.p12", "~/repos/**/*.pfx",
# ]

# Paths relative to the project root that stay read-only (no commits, hooks).
# project_read_only = [".git"]

[pi]
# One config for sandboxed and plain pi. The agent dir is mounted read-only
# (extensions, packages, mcp.json, ...) except:
#   shared: read-write, the same files plain pi uses - so /login, /settings,
#           /model and project trust work inside the sandbox
#   local:  sandbox-local (logs, model cache, locks), never seen by plain pi;
#           also mcp-auth.json, so MCP logins done in plain pi stay outside
# With the broker, auth.json is shared in name only: the sandbox gets a
# placeholder copy in its place.
# agent_dir = "~/.pi/agent"
# shared = ["auth.json", "sessions", "settings.json", "trust.json"]
# local = ["mcp-auth.json", "mcp.log*", "models-store.json", "*.lock", ".gitignore"]

[broker]
# Credential broker: cred-broker, one proxy on the VM's localhost that puts
# the real tokens into the sandbox's requests; the sandbox only holds
# placeholders. pi-safe starts it on demand. Its port, rules and token
# sources: ~/.config/cred-broker/config.toml. Manage it with
# `cred-broker start|stop|restart|status`.
enabled = true
# command = ["cred-broker"]
# pi logins served by the broker; other auth.json entries are left out.
# providers = ["github-copilot", "anthropic"]
# Set to the placeholder so tools that require a token send requests at all
# (gh reads GITHUB_TOKEN too, GH_TOKEN is not needed).
# placeholder_env = ["GITHUB_TOKEN", "JIRA_PAT_TOKEN"]

[env]
# The sandbox starts from an empty environment: HOME, USER, LOGNAME and a PATH
# filtered to visible dirs, plus these.
# pass = ["TERM", "COLORTERM", "TERM_PROGRAM", "TERM_PROGRAM_VERSION", "LANG", "LC_ALL", "LC_CTYPE", "TZ", "EDITOR", "VISUAL"]
# set = { PI_SAFE = "1" }
