# pnpm-only registry auth (npm never reads this file). It overrides the
# shared ~/.config/npm/.npmrc, and pnpm accepts tokenHelper only in user-level
# files like this one, never in a project's .npmrc.
#
# GitHub Packages tokens: classic PATs with read:packages only, kept apart from
# the git/gh tokens (personal/dotfiles/github-tokens/<org>). pnpm runs the
# helper when it needs the token, so it never sits in the environment.
# A per-scope entry wins over the host default.
//npm.pkg.github.com/:tokenHelper=gopass show -o personal/dotfiles/npm-tokens/default
//npm.pkg.github.com/:@asg-song:tokenHelper=gopass show -o personal/dotfiles/npm-tokens/ASG-SONG
